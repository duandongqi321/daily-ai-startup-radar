version: "0.4.0"
profile: "default-api-sources"

defaults:
  lookback_hours: 24
  fallback_lookback_hours: 72
  max_raw_results_per_source: 25
  max_candidates_after_dedupe: 30
  require_current_signal: true

regions:
  - "Silicon Valley"
  - "New York"
  - "Singapore"
  - "Hong Kong"

queries:
  - '"AI startup" funding OR launch OR partnership'
  - '"AI agent" startup'
  - '"vertical AI" company'
  - '"healthcare AI" startup'
  - '"career AI" startup'
  - '"sports AI" startup'
  - '"AI startup" "Singapore"'
  - '"AI startup" "Hong Kong"'
  - '"AI startup" "New York"'
  - '"AI startup" "San Francisco"'

sources:
  - name: "github"
    enabled: true
    provider: "github"
    purpose: "Find open-source AI infra, developer tools, and repo traction."
    auth_env: "GITHUB_TOKEN"
    requires_auth: false
    max_results: 20
    queries:
      - '"AI agent" created:>=<since-date>'
      - '"LLM agent" created:>=<since-date>'
      - '"vertical AI" created:>=<since-date>'
      - '"healthcare AI" created:>=<since-date>'
      - '"career AI" created:>=<since-date>'
      - '"sports analytics" AI created:>=<since-date>'

  - name: "gdelt"
    enabled: true
    provider: "gdelt"
    purpose: "Find recent public news signals across regions."
    auth_env: ""
    requires_auth: false
    max_results: 25
    queries:
      - '("AI startup" OR "artificial intelligence startup" OR "AI company") ("funding" OR "launch" OR "raised" OR "partnership") ("Singapore" OR "Hong Kong" OR "New York" OR "San Francisco")'
      - '("AI agent startup" OR "vertical AI startup" OR "healthcare AI startup" OR "sports AI startup" OR "career AI startup")'

  - name: "product_hunt"
    enabled: false
    provider: "product_hunt"
    purpose: "Find new AI product launches."
    auth_env: "PRODUCTHUNT_TOKEN"
    requires_auth: true
    max_results: 20
    queries:
      - "AI"
      - "agent"
      - "developer tools"

  - name: "newsapi"
    enabled: false
    provider: "newsapi"
    purpose: "Find recent secondary news coverage."
    auth_env: "NEWSAPI_KEY"
    requires_auth: true
    max_results: 25
    queries:
      - '"AI startup" AND (funding OR launch OR partnership)'

  - name: "crunchbase"
    enabled: false
    provider: "crunchbase"
    purpose: "Enrich company and funding data when a Crunchbase API key is available."
    auth_env: "CRUNCHBASE_API_KEY"
    requires_auth: true
    max_results: 20
    queries:
      - "AI startup"
